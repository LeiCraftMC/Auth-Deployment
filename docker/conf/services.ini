; supervisord configuration of the bundle (/etc/supervisor/supervisord.conf in the image, the
; container entrypoint): runs Zitadel, the Zitadel login and LAVIAC as the user leicraftmc,
; restarts one that exits, and sends all output to the container log. SIGTERM stops all three.

[supervisord]
nodaemon=true
; With nodaemon, supervisord logs to stdout too. No files: the image is not writable for leicraftmc.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; supervisorctl in the container, e.g. `docker exec <container> supervisorctl status`
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; TLS terminates at the reverse proxy (README.md: Routing), the health check expects plain HTTP
[program:zitadel]
command=/opt/leicraftmc/auth/scripts/run-zitadel.sh
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; configured with LCMC_AUTH_LOGIN_* (docker/scripts/run-login.sh ). stopasgroup: upstream's entrypoint.sh
; sits between supervisord and Bun.
[program:login]
directory=/opt/leicraftmc/auth/login
command=/opt/leicraftmc/auth/scripts/run-login.sh
autostart=true
autorestart=true
stopasgroup=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:laviac]
directory=/opt/leicraftmc/auth/laviac
command=bun run /opt/leicraftmc/auth/laviac/app/.output/server/index.mjs
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
