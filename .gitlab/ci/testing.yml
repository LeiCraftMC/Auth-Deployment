default:
  interruptible: true

# Fast checks before the bundle build. buildpack-deps:*-scm has git, bash and GNU coreutils
# (apply-overrides.sh uses `sha256sum --check --quiet`).

# login/overrides still fit the Zitadel tag of the Dockerfile (login/README.md: Upgrading Zitadel).
test:overrides:
  stage: test
  before_script:
    - apt-get update
    - apt-get install -y ca-certificates curl gnupg git
  script:
    - ZITADEL_VERSION=$(sed -n 's/^ARG ZITADEL_VERSION=//p' Dockerfile)
    - git clone --quiet --depth 1 --branch "$ZITADEL_VERSION" --filter=blob:none --sparse https://github.com/zitadel/zitadel.git /tmp/zitadel
    - git -C /tmp/zitadel sparse-checkout set apps/login
    - sh login/apply-overrides.sh /tmp/zitadel

test:scripts:
  stage: test
  script:
    - bash -n docker/entrypoint.sh
    - sh -n docker/healthcheck.sh
    - sh -n login/apply-overrides.sh
    - sh -n login/upstream-checksums.sh
