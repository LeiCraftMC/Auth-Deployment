
# The bundle image (Dockerfile: Zitadel, the themed Zitadel login, LAVIAC). Built on every branch,
# so a Zitadel upgrade that breaks login/overrides fails before it is merged; pushed from the
# default branch only, as :latest and :<ZITADEL_VERSION>.
build-and-push:
  stage: build
  variables:
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  cache: []

  tags:
    - glar-linux-medium-amd64

  before_script:
    # Docker install
    - apt-get update
    - apt-get install -y ca-certificates curl gnupg

    # Docker install

    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    - chmod a+r /etc/apt/keyrings/docker.gpg
    - . /etc/os-release
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update
    - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
    - dockerd > /tmp/dockerd.log 2>&1 &
    - sleep 5
    - docker info || { cat /tmp/dockerd.log; exit 1; }

    # Authenticate with the registry before the build: it pulls the LAVIAC image from it. The job
    # token can only pull it if the LAVIAC project allows this project (Settings > CI/CD > Job token
    # permissions).
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - ZITADEL_VERSION=$(sed -n 's/^ARG ZITADEL_VERSION=//p' Dockerfile)
    - docker build -f docker/Dockerfile -t "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$ZITADEL_VERSION" .
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker push --all-tags "$CI_REGISTRY_IMAGE"
      fi

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
