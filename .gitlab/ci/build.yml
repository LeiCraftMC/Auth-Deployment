
build-and-push:
  stage: build
  variables:
    BUN_INSTALL_CACHE_DIR: .bun/install/cache
    NUXT_TELEMETRY_DISABLED: "1"
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  cache:
    key:
      files:
        - bun.lock
    paths:
      - .bun/install/cache/
      - node_modules/

  tags:
    - glar-linux-medium-amd64

  before_script:
    # Dependencies (including devDependencies — the build step needs them)
    - apt-get update
    - apt-get install -y ca-certificates curl gnupg
    - bun install --frozen-lockfile

    # Docker install
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    - chmod a+r /etc/apt/keyrings/docker.gpg
    - . /etc/os-release
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update
    - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
    - dockerd > /tmp/dockerd.log 2>&1 &
    - sleep 5
    - docker info || { cat /tmp/dockerd.log; exit 1; }

    # Authenticate with the registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin

  script:
    - bun run build
    - docker build -f docker/Dockerfile -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
